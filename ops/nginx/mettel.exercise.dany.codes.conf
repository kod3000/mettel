# Bruin site config for mettel.exercise.dany.codes.
# Preserves the Certbot-managed SSL + HTTP-to-HTTPS redirect stanzas at
# the bottom. Design notes:
#
#   - `location /` serves the SPA (Vite `npm run build` output) as static
#     files. Set $WEB_ROOT via the `root` directive below to the path
#     where you rsync `apps/web/dist/` on your deploy host.
#   - `location /api/v1/` is the direct proxy the SPA calls; upstream is
#     the API container on 127.0.0.1:8081. `client_max_body_size 500m`
#     matches BulkJobEndpoints.MaxFileBytes (200 MB) + headroom for
#     multipart overhead.
#   - `location /use/v1/api/` is a public alias that rewrites to
#     /api/v1/; useful for external callers that want a stable URL
#     namespace independent of the internal path scheme.

upstream bruin_api {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    server_name mettel.exercise.dany.codes;

    # Point this at the directory where you rsync `apps/web/dist/`.
    root /srv/mettel/web;
    index index.html;

    # SPA shell (built assets + index.html). The Vite build emits
    # hash-suffixed asset filenames under /assets/, so a plain try_files
    # is enough — no cache-busting rules needed.
    location = / { try_files /index.html =404; }
    location / { try_files $uri $uri/ /index.html; }

    # OpenAPI doc — the API emits it at /openapi/{name}.json (no auth,
    # since a spec is public by nature). Proxy without the SPA catch-all
    # intercepting it. Without this, /openapi/v1.json would fall through
    # `location /` and return index.html.
    location /openapi/ {
        proxy_pass http://bruin_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-friendly direct proxy — same upstream as the /use/v1/api/*
    # rewrite below.
    location /api/v1/ {
        proxy_pass http://bruin_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_request_buffering off;   # stream large bulk-upload POSTs to the API
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        client_max_body_size 500m;     # matches BulkJobEndpoints.MaxFileBytes (200 MB) + headroom
    }

    # Rewrite public /use/v1/api/* to internal /api/v1/*
    location /use/v1/api/ {
        rewrite ^/use/v1/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://bruin_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE: disable buffering + keep the connection open long enough for
        # a slow bulk job to report progress. `/bulk-jobs/{id}/events` is
        # the only long-lived response.
        proxy_buffering    off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;

        proxy_pass_request_headers on;
        add_header X-Bruin-Proxy "nginx" always;

        client_max_body_size 500m;
    }

    # Also expose the raw health probes for monitoring
    location /use/v1/health/ {
        rewrite ^/use/v1/health/(.*)$ /health/$1 break;
        proxy_pass http://bruin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dany.codes/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dany.codes/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mettel.exercise.dany.codes) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name mettel.exercise.dany.codes;
    return 404; # managed by Certbot
}
