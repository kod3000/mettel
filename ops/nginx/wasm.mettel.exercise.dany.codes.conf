# Bruin WASM SPA site config for wasm.mettel.exercise.dany.codes.
# Preserves the Certbot-managed SSL + HTTP-to-HTTPS redirect stanzas at
# the bottom. Sibling of mettel.exercise.dany.codes.conf — this host
# serves the Blazor WebAssembly twin of the React SPA against the same
# API upstream (127.0.0.1:8081).
#
# Key differences vs. the React host:
#   - The WASM app ships pre-compressed .br / .gz variants for the
#     framework files. `gzip_static on` + `brotli_static on` let nginx
#     serve them directly instead of decompressing on the fly.
#   - `application/wasm` MIME type must be set explicitly on some
#     nginx builds; without it the browser refuses to instantiate the
#     module.
#   - Long-cache the versioned _framework/ files, but never index.html
#     (users need the new hash list on redeploy).

upstream bruin_api_wasm {
    server 127.0.0.1:8081;
    keepalive 32;
}

types {
    application/wasm  wasm;
}

server {
    server_name wasm.mettel.exercise.dany.codes;

    # Point this at the directory where you rsync
    # `web-wasm/bin/Release/net9.0/publish/wwwroot/`.
    root /srv/mettel-wasm/web;
    index index.html;

    # SPA shell — never cache index.html so redeploys pick up.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Long-cache the versioned framework + assembly files. Blazor's
    # loader appends a `?<hash>` query string that busts the cache when
    # the payload changes.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip_static on;
        # brotli_static on;   # enable if the nginx build has ngx_brotli
        try_files $uri =404;
    }

    # Static assets under wwwroot/ (css/js/img) — hash-independent but
    # small; a short cache with revalidation is fine.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Same API proxy shape as the React host so this SPA can hit the
    # canonical /api/v1/* path without CORS. `client_max_body_size 500m`
    # is inherited from the React host's rationale (see comments there).
    location /api/v1/ {
        proxy_pass http://bruin_api_wasm;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
        client_max_body_size 500m;
    }

    # Health probes — same-origin so a browser fetch works without CORS.
    location /health/ {
        proxy_pass http://bruin_api_wasm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Certbot-managed SSL block. Regenerate with:
    #   sudo certbot --nginx -d wasm.mettel.exercise.dany.codes
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/wasm.mettel.exercise.dany.codes/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wasm.mettel.exercise.dany.codes/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    listen 80;
}

